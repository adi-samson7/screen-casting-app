plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.cast.core'
    compileSdk { version = release(36) { minorApiLevel = 1 } }

    defaultConfig {
        minSdk 22
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api 'io.getstream:stream-webrtc-android:1.3.10'   // org.webrtc.* (shared by the TV and phone apps)
}
