plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cast'
    compileSdk { version = release(36) { minorApiLevel = 1 } }

    defaultConfig {
        applicationId "com.example.cast"
        minSdk 22          // Fire TV Stick (Fire OS 5+)
        targetSdk 34
        versionCode 10
        versionName "0.10"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug      // sideloading only: debug-signed is fine
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    implementation project(':core')                              // shared: glass UI, PC discovery, WebRTC (org.webrtc.* with MediaCodec hardware decoding)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'          // WebSocket signaling
}
