plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.castsender'
    compileSdk { version = release(36) { minorApiLevel = 1 } }

    defaultConfig {
        applicationId "com.example.castsender"
        minSdk 24           // Android 7+
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug      // sideloading only: debug-signed is fine
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    implementation project(':core')                              // shared: glass UI, PC discovery, WebRTC
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'          // WebSocket signaling
}
