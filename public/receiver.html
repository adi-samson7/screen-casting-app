<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast Receiver</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
  #idle { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.4vw, 24px); padding: 0 12px; box-sizing: border-box; }
  #code { font-size: clamp(36px, 15vw, 140px); letter-spacing: .17em; margin-right: -.17em; font-weight: 700; }
  #hint { font-size: clamp(13px, 3.3vw, 30px); color: #9aa; text-align: center; line-height: 1.5; }
  #hint2 { font-size: clamp(12px, 2.8vw, 26px); color: #9aa; }
  #status { position: fixed; bottom: 12px; right: 16px; font-size: clamp(11px, 2.3vw, 20px); color: #678; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="idle">
  <div id="hint">Open this address on your PC, click <b>Start casting</b>,<br>and enter the code</div>
  <div id="code">------</div>
  <div id="hint2"></div>
</div>
<button id="soundBtn" style="display:none;position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:9;font-size:clamp(16px,5vw,40px);padding:clamp(10px,3vw,24px) clamp(16px,6vw,48px);border-radius:16px;border:4px solid #ff9900;background:#222;color:#fff">🔊 Press Select to enable sound</button>
<div id="status">connecting…</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const embedded = params.has('embed');          // inside the PC app's Receive tab (phone -> PC)
const myName = params.get('name');              // shown to the sender as "Casting to <name>"
if (embedded) $('hint').innerHTML = 'On your phone open <b>Cast Sender</b>,<br>choose this PC and enter the code';
const soundBtn = $('soundBtn');
const video = $('v'), idle = $('idle'), codeEl = $('code'), statusEl = $('status');
$('hint2').textContent = location.host;

let ws, pc;
let tvMuted = false, tvVolume = 1;   // controlled from the sender's sound panel; default: sound on
let unlocked = false;                // browsers may need a remote press before sound is allowed

function applyAudio() {
  const want = !tvMuted;
  video.muted = !want;                      // try unmuted straight away; the browser may refuse
  video.volume = tvVolume;
  if (video.srcObject) {
    video.play().then(() => { if (want) unlocked = true; soundBtn.style.display = 'none'; reportAudio(); })
      .catch(() => {
        // Autoplay with sound blocked: fall back to muted and ask for a click/Select press.
        video.muted = true; unlocked = false;
        video.play().catch(() => {});
        soundBtn.style.display = want ? 'block' : 'none';
        if (want) soundBtn.focus();
        reportAudio();
      });
  }
  reportAudio();
}

function reportAudio() {
  if (!ws || ws.readyState !== 1) return;
  const tracks = video.srcObject ? video.srcObject.getAudioTracks() : [];
  ws.send(JSON.stringify({ type: 'audio-state', volume: Math.round(tvVolume * 100), unlocked, muted: video.muted,
    audioTracks: tracks.length, trackLive: tracks.some((t) => t.readyState === 'live' && !t.muted) }));
}

function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { statusEl.textContent = 'ready'; ws.send(JSON.stringify({ type: 'register', name: myName || undefined })); };
  ws.onclose = () => { statusEl.textContent = 'reconnecting…'; resetPeer(); setTimeout(connect, 2000); };
  ws.onmessage = async (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'registered') codeEl.textContent = m.code;
    else if (m.type === 'sender-joined') statusEl.textContent = 'sender connected';
    else if (m.type === 'offer') await handleOffer(m);
    else if (m.type === 'candidate' && pc) { try { await pc.addIceCandidate(m.candidate); } catch {} }
    else if (m.type === 'audio-output') { tvMuted = !!m.muted; tvVolume = Math.max(0, Math.min(1, m.volume)); applyAudio(); showAudioBadge(); }
    else if (m.type === 'bye') resetPeer();
  };
}

async function handleOffer(m) {
  resetPeer();
  pc = new RTCPeerConnection({ iceServers: [] });   // LAN only; add a STUN server here for remote use
  pc.onicecandidate = (e) => e.candidate && ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
  pc.ontrack = (e) => {
    try { e.receiver.jitterBufferTarget = 100; } catch {}   // keep the TV-side buffer small (less delay)
    try { e.receiver.playoutDelayHint = 0.1; } catch {}
    video.muted = true;                       // muted autoplay is always allowed; press any remote key for sound
    video.srcObject = e.streams[0];
    applyAudio();
    video.style.display = 'block'; idle.style.display = 'none';
    try { if (window.parent !== window) parent.postMessage({ cast: 'receiving' }, location.origin); } catch {}   // lets the PC app jump to the Receive tab
    video.play().catch((err) => { statusEl.textContent = 'play blocked: ' + err.name + ' - press OK on remote'; });
    statusEl.textContent = 'receiving stream…';
  };
  pc.oniceconnectionstatechange = () => { statusEl.textContent = 'ice: ' + pc.iceConnectionState; };
  pc.onconnectionstatechange = () => {
    statusEl.textContent = 'conn: ' + pc.connectionState;
    if (['failed', 'closed'].includes(pc.connectionState)) resetPeer();
  };
  await pc.setRemoteDescription(m.offer);
  const answer = await pc.createAnswer();
  answer.sdp = answer.sdp.replace(/(a=fmtp:\d+ [^\r\n]*useinbandfec=1)/, '$1;stereo=1;sprop-stereo=1');
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: 'answer', answer: pc.localDescription }));
}

function resetPeer() {
  if (pc) { pc.close(); pc = null; }
  video.srcObject = null;
  video.style.display = 'none'; idle.style.display = 'flex';
  if (ws && ws.readyState === 1) statusEl.textContent = 'ready';
}

// Any remote-control press: start playback and turn sound on.
['keydown', 'keyup', 'click', 'mousedown', 'pointerdown', 'touchstart'].forEach((ev) =>
  document.addEventListener(ev, () => { applyAudio(); showAudioBadge(); }, true));
setInterval(reportAudio, 2000);

function showAudioBadge() {
  if (!video.srcObject) return;
  statusEl.textContent = tvMuted ? 'Fire TV muted' : unlocked ? `Fire TV volume ${Math.round(tvVolume * 100)}%` : 'Press any remote button for sound';
  clearTimeout(showAudioBadge.t);
  showAudioBadge.t = setTimeout(() => { statusEl.textContent = ''; }, 4000);
}
video.addEventListener('playing', () => { statusEl.textContent = ''; });

// double-click / double-tap: full screen on and off
document.addEventListener('dblclick', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

connect();
</script>
</body>
</html>
